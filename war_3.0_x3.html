<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🌍 WORLD WAR · BIG MAP · ARROW KEYS NAVIGATE BETWEEN UNITS</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a2010, #030a04);
            font-family: 'Segoe UI', 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .war-room {
            background: #1a150edd;
            backdrop-filter: blur(3px);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,220,100,0.3);
            border: 3px solid #dba551;
            width: fit-content;
            max-width: 98vw;
        }

        /* TOP COMMAND BAR */
        .top-command-bar {
            background: #18140cee;
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #e2bc6e;
            box-shadow: 0 4px 12px black;
        }

        .nation-selector-compact {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f0a05cc;
            padding: 5px 14px;
            border-radius: 60px;
        }

        .nation-dropdown {
            padding: 6px 12px;
            border-radius: 40px;
            background: #3c2e1c;
            color: #ffefcf;
            font-weight: bold;
            border: 1px solid #e6bc6e;
            cursor: pointer;
        }

        .flag-preview { font-size: 1.6rem; }
        .stats-compact { display: flex; gap: 16px; background: #0f0a05aa; padding: 5px 16px; border-radius: 60px; font-weight: bold; }
        .unit-palette-compact { display: flex; gap: 6px; background: #0f0a05aa; padding: 5px 12px; border-radius: 60px; }
        .unit-card-compact { background: #2f2a1f; border-radius: 40px; padding: 3px 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; border: 1px solid #b89048; }
        .unit-card-compact.selected { background: #5f794b; border: 2px solid #ffd966; }
        .btn-compact { background: #3c2b1a; border: none; font-weight: bold; padding: 5px 14px; border-radius: 60px; color: #fce6b4; cursor: pointer; box-shadow: 0 2px 0 #1a1208; }
        .btn-compact:active { transform: translateY(2px); }
        .turn-indicator-compact { background: #221f16; padding: 5px 18px; border-radius: 60px; font-weight: bold; }
        .download-btn { background: #2a6b3a; color: #ffefb0; }

        /* BIG MAP CONTAINER */
        .map-container {
            background: #0a1a0f;
            border-radius: 28px;
            padding: 12px;
            box-shadow: inset 0 0 0 4px #ecd99b, inset 0 0 0 10px #5a3e1f, 0 12px 28px black;
        }

        .world-map {
            position: relative;
            width: 1500px;
            height: 850px;
            background: #1a6b7a;
            border-radius: 20px;
            overflow: hidden;
            cursor: crosshair;
            box-shadow: 0 6px 16px black;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #mapCanvas { pointer-events: none; z-index: 1; }
        #unitCanvas { pointer-events: auto; z-index: 2; cursor: grab; }
        #unitCanvas:active { cursor: grabbing; }

        .bottom-info { display: flex; justify-content: space-between; margin-top: 12px; gap: 20px; flex-wrap: wrap; }
        .combat-log { background: #020812cc; border-radius: 16px; padding: 8px; height: 110px; overflow-y: auto; font-size: 0.7rem; font-family: monospace; color: #d4f0b0; flex: 2; }
        .keyboard-hint { background: #0f0a05aa; border-radius: 16px; padding: 8px 16px; font-size: 11px; color: #ffefb0; text-align: center; flex: 1; }

        @media (max-width: 1600px) {
            .world-map { width: 1200px; height: 680px; }
        }
        @media (max-width: 1300px) {
            .world-map { width: 1000px; height: 570px; }
            .top-command-bar { gap: 8px; padding: 8px 12px; }
        }
    </style>
</head>
<body>
<div class="war-room">
    <div class="top-command-bar">
        <div class="nation-selector-compact">
            <span>🎌</span>
            <select id="nationSelect" class="nation-dropdown">
                <option value="usa">🇺🇸 USA</option><option value="canada">🇨🇦 CANADA</option>
                <option value="uk">🇬🇧 UK</option><option value="germany">🇩🇪 GERMANY</option>
                <option value="france">🇫🇷 FRANCE</option><option value="italy">🇮🇹 ITALY</option>
                <option value="portugal">🇵🇹 PORTUGAL</option><option value="spain">🇪🇸 SPAIN</option>
                <option value="brazil">🇧🇷 BRAZIL</option><option value="japan">🇯🇵 JAPAN</option>
                <option value="australia">🇦🇺 AUSTRALIA</option>
            </select>
            <div class="flag-preview" id="flagPreview">🇺🇸</div>
            <button class="btn-compact" id="setNationBtn">SET</button>
        </div>
        <div class="stats-compact"><span>🎖️ <span id="unitCount">0</span></span><span>💪 <span id="totalPower">0</span></span></div>
        <div class="unit-palette-compact" id="unitPalette"></div>
        <div class="turn-indicator-compact" id="turnIndicator">🔴 YOUR TURN</div>
        <button class="btn-compact" id="endTurnBtn">⏳ END</button>
        <button class="btn-compact" id="resetWarBtn">🌍 RESET</button>
        <button class="btn-compact download-btn" id="downloadMapBtn">📸 DOWNLOAD</button>
    </div>

    <div class="map-container">
        <div class="world-map" id="worldMapContainer">
            <canvas id="mapCanvas" width="1500" height="850"></canvas>
            <canvas id="unitCanvas" width="1500" height="850"></canvas>
        </div>
        <div class="bottom-info">
            <div class="combat-log" id="warLog">> WORLD MAP READY<br>> ARROW KEYS: navigate between your units (Up/Down/Left/Right)<br>> DELETE = remove selected unit | R = rotate<br>> Click YOUR unit → click ENEMY to ATTACK | Drag to move</div>
            <div class="keyboard-hint">⌨️ NAVIGATION:<br>← ↑ → ↓ = move between units<br>DELETE = delete selected<br>R = rotate</div>
        </div>
    </div>
</div>

<script>
    // NATIONS
    const NATIONS = {
        usa: { name: "UNITED STATES", flag: "🇺🇸", fullName: "UNITED STATES", flagColor1: "#b22234", flagColor2: "#3c3b6e" },
        canada: { name: "CANADA", flag: "🇨🇦", fullName: "CANADA", flagColor1: "#ff0000", flagColor2: "#ffffff" },
        uk: { name: "UNITED KINGDOM", flag: "🇬🇧", fullName: "UNITED KINGDOM", flagColor1: "#012169", flagColor2: "#c8102e" },
        germany: { name: "GERMANY", flag: "🇩🇪", fullName: "GERMANY", flagColor1: "#000000", flagColor2: "#dd0000" },
        france: { name: "FRANCE", flag: "🇫🇷", fullName: "FRANCE", flagColor1: "#0055a4", flagColor2: "#ef4135" },
        italy: { name: "ITALY", flag: "🇮🇹", fullName: "ITALY", flagColor1: "#009246", flagColor2: "#ce2b37" },
        portugal: { name: "PORTUGAL", flag: "🇵🇹", fullName: "PORTUGAL", flagColor1: "#006600", flagColor2: "#ff0000" },
        spain: { name: "SPAIN", flag: "🇪🇸", fullName: "SPAIN", flagColor1: "#aa151b", flagColor2: "#f1bf00" },
        brazil: { name: "BRAZIL", flag: "🇧🇷", fullName: "BRAZIL", flagColor1: "#009c3b", flagColor2: "#ffdf00" },
        japan: { name: "JAPAN", flag: "🇯🇵", fullName: "JAPAN", flagColor1: "#bc002d", flagColor2: "#ffffff" },
        australia: { name: "AUSTRALIA", flag: "🇦🇺", fullName: "AUSTRALIA", flagColor1: "#00008b", flagColor2: "#ff0000" }
    };
    const ENEMY_NATION = { name: "RUSSIA", flag: "🇷🇺", fullName: "RUSSIA", flagColor1: "#0033a0", flagColor2: "#da291c" };
    
    const UNIT_TYPES = {
        tank: { name: "TANK", emoji: "🚀", power: 45, health: 45, size: 36 },
        heli: { name: "HELI", emoji: "🚁", power: 38, health: 38, size: 36 },
        soldier: { name: "SOLDIER", emoji: "⚔️", power: 22, health: 22, size: 34 },
        ship: { name: "BATTLESHIP", emoji: "⚓", power: 52, health: 52, size: 38 }
    };
    
    class GameUnit {
        constructor(id, owner, type, x, y, rotation = 0) {
            this.id = id; this.owner = owner; this.type = type;
            this.name = UNIT_TYPES[type].name; this.emoji = UNIT_TYPES[type].emoji;
            this.power = UNIT_TYPES[type].power; this.health = UNIT_TYPES[type].health;
            this.x = x; this.y = y; this.rotation = rotation;
        }
        rotate() { this.rotation = (this.rotation + 90) % 360; }
    }
    
    let currentPlayerNation = { ...NATIONS.usa };
    let units = []; let nextId = 100;
    let selectedUnitType = "tank";
    let currentTurn = "player";
    let selectedAttacker = null;
    let selectedUnitId = null;
    
    // Drag state
    let dragTarget = null, dragStartX = 0, dragStartY = 0, isDragging = false, dragStarted = false, dragThreshold = 5;
    
    const mapCanvas = document.getElementById("mapCanvas");
    const unitCanvas = document.getElementById("unitCanvas");
    const ctxMap = mapCanvas.getContext("2d");
    const ctxUnit = unitCanvas.getContext("2d");
    let mapWidth = 1500, mapHeight = 850;
    
    // DOM
    const unitCountSpan = document.getElementById("unitCount");
    const totalPowerSpan = document.getElementById("totalPower");
    const turnIndicator = document.getElementById("turnIndicator");
    const warLog = document.getElementById("warLog");
    const unitPalette = document.getElementById("unitPalette");
    const endTurnBtn = document.getElementById("endTurnBtn");
    const resetBtn = document.getElementById("resetWarBtn");
    const nationSelect = document.getElementById("nationSelect");
    const flagPreview = document.getElementById("flagPreview");
    const setNationBtn = document.getElementById("setNationBtn");
    const downloadBtn = document.getElementById("downloadMapBtn");
    
    // World map background
    let bgImage = new Image();
    let imageLoaded = false;
    bgImage.src = "https://gisgeography.com/wp-content/uploads/2022/04/High-Resolution-World-Map-1536x768.jpg";
    bgImage.onload = () => { imageLoaded = true; drawWorldMapBackground(); };
    
    function drawWorldMapBackground() {
        if (imageLoaded && bgImage.complete) ctxMap.drawImage(bgImage, 0, 0, mapWidth, mapHeight);
        else { ctxMap.fillStyle = "#1a6b7a"; ctxMap.fillRect(0, 0, mapWidth, mapHeight); ctxMap.font = "bold 24px Georgia"; ctxMap.fillStyle = "#fff5c0"; ctxMap.fillText("WORLD MAP", mapWidth/2-80, mapHeight/2); }
    }
    
    function addLog(msg) { warLog.innerHTML += `<div>> ${msg}</div>`; warLog.scrollTop = warLog.scrollHeight; }
    
    function updateStats() {
        unitCountSpan.innerText = units.length;
        let total = units.reduce((sum, u) => sum + u.health, 0);
        totalPowerSpan.innerText = total;
        let playerUnits = units.filter(u => u.owner === "player");
        let enemyUnits = units.filter(u => u.owner === "enemy");
        if(playerUnits.length === 0 && enemyUnits.length > 0) { addLog(`💀 DEFEAT!`); turnIndicator.innerText = "💀 DEFEAT"; endTurnBtn.disabled = true; }
        else if(enemyUnits.length === 0 && playerUnits.length > 0) { addLog(`🏆 VICTORY!`); turnIndicator.innerText = "🏆 VICTORY!"; endTurnBtn.disabled = true; }
    }
    
    function drawUnits() {
        ctxUnit.clearRect(0, 0, mapWidth, mapHeight);
        units.forEach(unit => {
            const def = UNIT_TYPES[unit.type];
            const size = def.size;
            const isPlayer = unit.owner === "player";
            const nationFlag = isPlayer ? currentPlayerNation.flag : ENEMY_NATION.flag;
            const nationFullName = isPlayer ? currentPlayerNation.fullName : ENEMY_NATION.fullName;
            const isSelected = (selectedAttacker && selectedAttacker.id === unit.id) || (selectedUnitId === unit.id);
            
            ctxUnit.save();
            ctxUnit.translate(unit.x, unit.y);
            ctxUnit.rotate(unit.rotation * Math.PI / 180);
            ctxUnit.translate(-unit.x, -unit.y);
            ctxUnit.shadowBlur = isSelected ? 12 : 0;
            ctxUnit.shadowColor = "gold";
            ctxUnit.beginPath(); ctxUnit.arc(unit.x, unit.y, size/2 + 4, 0, Math.PI*2);
            ctxUnit.fillStyle = "#ffd966"; ctxUnit.fill();
            const grad = ctxUnit.createLinearGradient(unit.x - size/2, unit.y - size/2, unit.x + size/2, unit.y + size/2);
            grad.addColorStop(0, isPlayer ? currentPlayerNation.flagColor1 : ENEMY_NATION.flagColor1);
            grad.addColorStop(1, isPlayer ? currentPlayerNation.flagColor2 : ENEMY_NATION.flagColor2);
            ctxUnit.beginPath(); ctxUnit.arc(unit.x, unit.y, size/2, 0, Math.PI*2);
            ctxUnit.fillStyle = grad; ctxUnit.fill();
            ctxUnit.strokeStyle = isSelected ? "#ffd966" : "#aa8844";
            ctxUnit.lineWidth = isSelected ? 3 : 1.5; ctxUnit.stroke();
            ctxUnit.beginPath(); ctxUnit.arc(unit.x, unit.y, size/2 - 8, 0, Math.PI*2);
            ctxUnit.fillStyle = "#f5ecce"; ctxUnit.fill();
            ctxUnit.font = `${size-8}px "Segoe UI Emoji"`;
            ctxUnit.fillStyle = "#1f1a10";
            ctxUnit.fillText(unit.emoji, unit.x - 14, unit.y + 8);
            ctxUnit.restore();
            
            ctxUnit.font = `26px "Segoe UI Emoji"`;
            ctxUnit.fillStyle = "#000";
            ctxUnit.fillText(nationFlag, unit.x - 18, unit.y - 20);
            ctxUnit.font = `bold 9px monospace`;
            ctxUnit.fillStyle = "#1f1a10";
            let displayName = nationFullName.length > 8 ? nationFullName.substring(0, 8) : nationFullName;
            ctxUnit.fillText(displayName, unit.x - 24, unit.y + 32);
            ctxUnit.font = `bold 11px monospace`;
            ctxUnit.fillStyle = "#2d241a";
            ctxUnit.fillText(`❤️${unit.health}`, unit.x - 12, unit.y + 24);
            if(unit.rotation !== 0) { ctxUnit.font = `12px monospace`; ctxUnit.fillStyle = "#ffaa44"; ctxUnit.fillText("↻", unit.x + 18, unit.y - 16); }
        });
        ctxUnit.shadowBlur = 0;
    }
    
    function getUnitAt(mx, my) {
        for(let i=units.length-1; i>=0; i--) {
            const u = units[i];
            const size = UNIT_TYPES[u.type].size;
            const dx = mx - u.x, dy = my - u.y;
            if(Math.sqrt(dx*dx + dy*dy) < size/2 + 10) return u;
        }
        return null;
    }
    
    // ========== INTELLIGENT ARROW NAVIGATION ==========
    function getPlayerUnits() { return units.filter(u => u.owner === "player"); }
    
    function selectUnitById(id) {
        selectedUnitId = id;
        const unit = units.find(u => u.id === id);
        if(unit) addLog(`🎯 Selected: ${unit.name} (${currentPlayerNation.fullName}) at (${Math.round(unit.x)},${Math.round(unit.y)})`);
        drawUnits();
    }
    
    function navigateToClosestInDirection(dx, dy) {
        let playerUnits = getPlayerUnits();
        if(playerUnits.length === 0) { addLog("No player units to navigate"); return; }
        
        let currentUnit = playerUnits.find(u => u.id === selectedUnitId);
        if(!currentUnit && playerUnits.length > 0) { selectUnitById(playerUnits[0].id); return; }
        
        // Find unit with smallest angle difference in the desired direction
        let bestUnit = null;
        let bestScore = -Infinity;
        
        for(let unit of playerUnits) {
            if(unit.id === currentUnit.id) continue;
            let deltaX = unit.x - currentUnit.x;
            let deltaY = unit.y - currentUnit.y;
            let distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
            if(distance < 5) continue;
            
            // Normalize direction vectors
            let normX = deltaX / distance;
            let normY = deltaY / distance;
            let targetNormX = dx;
            let targetNormY = dy;
            
            // Dot product: how aligned is this unit with desired direction
            let alignment = normX * targetNormX + normY * targetNormY;
            // Weight by inverse distance (closer is better)
            let score = alignment / (distance / 100 + 0.1);
            
            if(score > bestScore) {
                bestScore = score;
                bestUnit = unit;
            }
        }
        
        if(bestUnit) selectUnitById(bestUnit.id);
        else addLog(`No unit ${dx > 0 ? "to the right" : dx < 0 ? "to the left" : dy > 0 ? "below" : "above"} found`);
    }
    
    function deleteSelectedUnit() {
        if(selectedUnitId === null) { addLog("No unit selected. Use arrow keys first."); return; }
        const idx = units.findIndex(u => u.id === selectedUnitId);
        if(idx !== -1 && units[idx].owner === "player") {
            addLog(`🗑️ Deleted ${units[idx].name}`);
            units.splice(idx, 1);
            if(selectedAttacker && selectedAttacker.id === selectedUnitId) selectedAttacker = null;
            selectedUnitId = null;
            let remaining = getPlayerUnits();
            if(remaining.length > 0) selectUnitById(remaining[0].id);
            drawUnits(); updateStats();
        } else if(idx !== -1) addLog("You can only delete YOUR units!");
    }
    
    function rotateSelectedUnit() {
        if(selectedUnitId === null) { addLog("Select a unit with arrow keys first"); return; }
        const unit = units.find(u => u.id === selectedUnitId);
        if(unit && unit.owner === "player") { unit.rotate(); drawUnits(); addLog(`🔄 ${unit.name} rotated`); }
        else if(unit) addLog("You can only rotate YOUR units!");
    }
    
    function handleKeyDown(e) {
        if(e.key === 'ArrowUp') { e.preventDefault(); navigateToClosestInDirection(0, -1); }
        else if(e.key === 'ArrowDown') { e.preventDefault(); navigateToClosestInDirection(0, 1); }
        else if(e.key === 'ArrowLeft') { e.preventDefault(); navigateToClosestInDirection(-1, 0); }
        else if(e.key === 'ArrowRight') { e.preventDefault(); navigateToClosestInDirection(1, 0); }
        else if(e.key === 'Delete') { e.preventDefault(); deleteSelectedUnit(); }
        else if(e.key === 'r' || e.key === 'R') { e.preventDefault(); rotateSelectedUnit(); }
    }
    
    function performAttack(attacker, defender) {
        if(currentTurn !== "player") { addLog("Not your turn!"); return false; }
        if(attacker.owner !== "player") { addLog("Attack with YOUR units!"); return false; }
        if(defender.owner !== "enemy") { addLog("Target must be enemy!"); return false; }
        let attackRoll = attacker.power + Math.floor(Math.random() * 15);
        let defendRoll = defender.power + Math.floor(Math.random() * 10);
        let damage = Math.max(8, attackRoll - Math.floor(defendRoll * 0.4));
        defender.health -= damage;
        addLog(`⚔️ ${currentPlayerNation.flag} ${attacker.name} attacks ${ENEMY_NATION.flag} ${defender.name} for ${damage} damage!`);
        if(defender.health <= 0) {
            addLog(`💥 Enemy ${defender.name} DESTROYED!`);
            let idx = units.findIndex(u => u.id === defender.id);
            if(idx !== -1) units.splice(idx, 1);
        } else {
            let counter = Math.floor(defender.power * 0.45) + Math.floor(Math.random() * 10);
            attacker.health -= counter;
            addLog(`⚠️ Enemy counterattack! Your ${attacker.name} loses ${counter} HP.`);
            if(attacker.health <= 0) {
                addLog(`💔 Your ${attacker.name} destroyed!`);
                let idx = units.findIndex(u => u.id === attacker.id);
                if(idx !== -1) units.splice(idx, 1);
                if(selectedUnitId === attacker.id) selectedUnitId = null;
            }
        }
        drawUnits(); updateStats();
        return true;
    }
    
    function addUnit(owner, type, x, y) {
        let def = UNIT_TYPES[type];
        let clampedX = Math.min(mapWidth - 40, Math.max(40, x));
        let clampedY = Math.min(mapHeight - 40, Math.max(40, y));
        let newUnit = new GameUnit(nextId++, owner, type, clampedX, clampedY, 0);
        units.push(newUnit);
        drawUnits(); updateStats();
        addLog(`➕ ${owner === "player" ? currentPlayerNation.flag : ENEMY_NATION.flag} ${def.name} deployed`);
        if(owner === "player") selectUnitById(newUnit.id);
    }
    
    function enemyTurn() {
        if(currentTurn !== "enemy") return;
        addLog(`🔥 ${ENEMY_NATION.flag} ${ENEMY_NATION.fullName} attacks...`);
        let enemyUnits = units.filter(u => u.owner === "enemy");
        let playerUnits = units.filter(u => u.owner === "player");
        for(let enemy of enemyUnits) {
            if(playerUnits.length === 0) break;
            let target = playerUnits[Math.floor(Math.random() * playerUnits.length)];
            let dmg = enemy.power + Math.floor(Math.random() * 12);
            target.health -= dmg;
            addLog(`💢 Enemy ${enemy.name} attacks your ${target.name} for ${dmg} damage!`);
            if(target.health <= 0) {
                addLog(`☠️ Your ${target.name} destroyed!`);
                let idx = units.findIndex(u => u.id === target.id);
                if(idx !== -1) units.splice(idx, 1);
                if(selectedUnitId === target.id) selectedUnitId = null;
                playerUnits = playerUnits.filter(u => u.id !== target.id);
            } else {
                let counter = Math.floor(target.power * 0.35);
                enemy.health -= counter;
                if(enemy.health <= 0) addLog(`✨ Your ${target.name} destroys enemy ${enemy.name}!`);
                let idx = units.findIndex(u => u.id === enemy.id);
                if(idx !== -1 && enemy.health <= 0) units.splice(idx, 1);
            }
            drawUnits(); updateStats();
        }
        if(units.filter(u => u.owner === "enemy").length < 2) addUnit("enemy", "soldier", 900 + Math.random() * 200, 300 + Math.random() * 200);
        currentTurn = "player";
        turnIndicator.innerHTML = `🔴 YOUR TURN · ${currentPlayerNation.fullName}`;
        selectedAttacker = null;
        drawUnits();
        addLog(`=== YOUR TURN STARTS ===`);
    }
    
    function endTurn() {
        if(currentTurn !== "player") return;
        currentTurn = "enemy";
        turnIndicator.innerHTML = `🔥 ${ENEMY_NATION.flag} ${ENEMY_NATION.fullName} TURN`;
        selectedAttacker = null;
        drawUnits();
        setTimeout(() => enemyTurn(), 400);
    }
    
    function resetGame() {
        units = []; nextId = 100; currentTurn = "player"; selectedAttacker = null; selectedUnitId = null;
        let playerStarts = [
            { type: "tank", x: 350, y: 220 }, { type: "heli", x: 500, y: 350 },
            { type: "soldier", x: 700, y: 280 }, { type: "ship", x: 620, y: 450 },
            { type: "tank", x: 1150, y: 580 }, { type: "heli", x: 1050, y: 250 }
        ];
        let enemyStarts = [
            { type: "tank", x: 900, y: 140 }, { type: "heli", x: 1000, y: 180 },
            { type: "ship", x: 750, y: 600 }, { type: "soldier", x: 850, y: 550 }
        ];
        playerStarts.forEach(s => units.push(new GameUnit(nextId++, "player", s.type, s.x, s.y, 0)));
        enemyStarts.forEach(s => units.push(new GameUnit(nextId++, "enemy", s.type, s.x, s.y, 0)));
        drawUnits(); updateStats();
        turnIndicator.innerHTML = `🔴 YOUR TURN · ${currentPlayerNation.fullName}`;
        endTurnBtn.disabled = false;
        addLog(`🌍 NEW GAME: ${currentPlayerNation.flag} ${currentPlayerNation.fullName} vs ${ENEMY_NATION.flag} ${ENEMY_NATION.fullName}`);
        drawWorldMapBackground();
        let first = getPlayerUnits()[0]; if(first) selectUnitById(first.id);
    }
    
    function setNation() { currentPlayerNation = { ...NATIONS[nationSelect.value] }; flagPreview.innerText = currentPlayerNation.flag; addLog(`🎌 Nation: ${currentPlayerNation.fullName}`); }
    
    function downloadMapImage() {
        let tempCanvas = document.createElement('canvas'); tempCanvas.width = mapWidth; tempCanvas.height = mapHeight;
        let tempCtx = tempCanvas.getContext('2d');
        if(imageLoaded && bgImage.complete) tempCtx.drawImage(bgImage, 0, 0, mapWidth, mapHeight);
        else { tempCtx.fillStyle = "#1a6b7a"; tempCtx.fillRect(0, 0, mapWidth, mapHeight); }
        tempCtx.drawImage(unitCanvas, 0, 0);
        tempCtx.strokeStyle = "#dba551"; tempCtx.lineWidth = 4; tempCtx.strokeRect(2, 2, mapWidth-4, mapHeight-4);
        tempCtx.font = "11px monospace"; tempCtx.fillStyle = "#ffefb0"; tempCtx.shadowBlur = 2;
        tempCtx.fillText(`${currentPlayerNation.fullName} vs ${ENEMY_NATION.fullName} | ${new Date().toLocaleString()}`, 10, mapHeight-8);
        let link = document.createElement('a');
        link.download = `war_map_${Date.now()}.png`;
        link.href = tempCanvas.toDataURL('image/png');
        link.click();
        addLog("📸 Screenshot saved!");
    }
    
    // Mouse handlers
    function handleMouseDown(e) {
        let rect = unitCanvas.getBoundingClientRect();
        let scaleX = unitCanvas.width / rect.width, scaleY = unitCanvas.height / rect.height;
        let mx = (e.clientX - rect.left) * scaleX, my = (e.clientY - rect.top) * scaleY;
        let clicked = getUnitAt(mx, my);
        if(clicked && e.button === 0) { dragTarget = clicked; dragStartX = mx; dragStartY = my; isDragging = true; dragStarted = false; unitCanvas.style.cursor = "grabbing"; e.preventDefault(); }
        else if(currentTurn === "player" && e.button === 0) addUnit("player", selectedUnitType, mx, my);
    }
    function handleMouseMove(e) { if(!isDragging || !dragTarget) return;
        let rect = unitCanvas.getBoundingClientRect();
        let scaleX = unitCanvas.width / rect.width, scaleY = unitCanvas.height / rect.height;
        let mx = (e.clientX - rect.left) * scaleX, my = (e.clientY - rect.top) * scaleY;
        let dx = mx - dragStartX, dy = my - dragStartY;
        if(!dragStarted && Math.sqrt(dx*dx+dy*dy) > dragThreshold) dragStarted = true;
        if(dragStarted) { dragTarget.x = Math.min(mapWidth-40, Math.max(40, mx)); dragTarget.y = Math.min(mapHeight-40, Math.max(40, my)); drawUnits(); }
    }
    function handleMouseUp() { if(dragStarted && dragTarget) addLog(`📍 ${dragTarget.name} moved`); dragTarget = null; isDragging = false; dragStarted = false; unitCanvas.style.cursor = "grab"; }
    function handleCanvasClick(e) { if(dragStarted) return;
        let rect = unitCanvas.getBoundingClientRect();
        let scaleX = unitCanvas.width / rect.width, scaleY = unitCanvas.height / rect.height;
        let mx = (e.clientX - rect.left) * scaleX, my = (e.clientY - rect.top) * scaleY;
        let clicked = getUnitAt(mx, my);
        if(clicked && currentTurn === "player") {
            if(selectedAttacker && selectedAttacker.id === clicked.id) { selectedAttacker = null; addLog("Attacker deselected"); drawUnits(); return; }
            if(clicked.owner === "player") { selectedAttacker = { id: clicked.id }; selectedUnitId = clicked.id; addLog(`🎯 Selected ${clicked.name} → click ENEMY unit`); drawUnits(); return; }
            if(clicked.owner === "enemy" && selectedAttacker) {
                let attackerUnit = units.find(u => u.id === selectedAttacker.id);
                if(attackerUnit && attackerUnit.health > 0) performAttack(attackerUnit, clicked);
                selectedAttacker = null; drawUnits();
            }
        }
    }
    
    function buildPalette() {
        unitPalette.innerHTML = "";
        for(let [key, def] of Object.entries(UNIT_TYPES)) {
            let card = document.createElement("div");
            card.className = "unit-card-compact";
            if(selectedUnitType === key) card.classList.add("selected");
            card.innerHTML = `<span style="font-size:22px;">${def.emoji}</span><span style="font-size:10px;">${def.name}</span><span style="font-size:9px;">⚡${def.power}</span>`;
            card.addEventListener("click", () => { selectedUnitType = key;
                document.querySelectorAll(".unit-card-compact").forEach(c => c.classList.remove("selected"));
                card.classList.add("selected"); addLog(`Selected ${def.name}`); });
            unitPalette.appendChild(card);
        }
    }
    
    unitCanvas.addEventListener('contextmenu', e => e.preventDefault());
    unitCanvas.addEventListener('mousedown', handleMouseDown);
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);
    unitCanvas.addEventListener('click', handleCanvasClick);
    window.addEventListener('keydown', handleKeyDown);
    
    setNationBtn.addEventListener("click", setNation);
    resetBtn.addEventListener("click", () => resetGame());
    endTurnBtn.addEventListener("click", endTurn);
    downloadBtn.addEventListener("click", downloadMapImage);
    unitCanvas.style.cursor = "grab";
    
    buildPalette();
    resetGame();
</script>
</body>
</html>
